# Required check for every pull request into main (and for main itself after a merge).
# Builds and tests everything, packages the app and runs the security baseline audit.
# Pure Swift: no Node or web UI to set up.
name: CI

on:
  pull_request:
    branches: [main]
    # "edited" fires when GitHub retargets a stacked PR onto main after its base merges;
    # without it the required check never starts on the retargeted PR.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token left in .git/config for later steps

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        timeout-minutes: 12 # a healthy run takes about 5; a hung test must not hold the runner for 40
        # Under a pseudo-terminal the test output is flushed line by line, so a hung run's log ends at the stuck test
        # instead of losing its last buffered chunk (the exit status of `make check` is passed through).
        run: script -q /dev/null make check

      # If the tests hang, say where: the stuck test process is still alive after the step times out.
      - name: Diagnose a hung test
        if: ${{ failure() }}
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          for pid in $(pgrep -f swiftpm-testing || true); do
            echo "::group::sample of swiftpm-testing $pid"
            sample "$pid" 5 -mayDie 2>&1 | head -300 || true
            echo "::endgroup::"
          done

      - name: Package and audit (scripts/verify-app.sh)
        run: make app

      - name: Self-test the packaged app
        run: |
          # stderr (one progress line per check, and the call stack if the app traps) goes to a file the next step reads.
          status=0
          perl -e 'alarm 120; exec @ARGV' build/Lily.app/Contents/MacOS/Lily --self-test 2> self-test.err || status=$?
          cat self-test.err
          exit "$status"

      # If the packaged app dies (the self-test has trapped with exit 133 and no other output), say where: the call stack
      # it printed is addresses in the stripped app, resolved here against the unstripped build of the same code.
      - name: Resolve the crash
        if: ${{ failure() }}
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin"
          [ -f self-test.err ] || exit 0
          echo "last checks:"; grep "^self-test" self-test.err | tail -3
          grep -q "self-test CRASH" self-test.err || { echo "no call stack was printed"; exit 0; }
          unstripped=$(ls core/.build/release/Lily core/.build/arm64-apple-macosx/release/Lily 2>/dev/null | head -1)
          echo "call stack, resolved against $unstripped:"
          slide=$(sed -n 's/^image slide: //p' self-test.err | head -1)
          load=$(printf '0x%x' $((0x100000000 + slide)))
          for address in $(grep -E "^[0-9]+ +Lily " self-test.err | awk '{print $3}'); do
            atos -o "$unstripped" -l "$load" "$address" 2>/dev/null || echo "$address"
          done | head -40
